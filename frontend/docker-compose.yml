version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Add your environment variables here
      # - NEXT_PUBLIC_API_URL=http://192.168.1.101:5000
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
