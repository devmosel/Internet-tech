version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      # Add your environment variables here
      - NEXT_PUBLIC_API_URL=http://seminar.devmosel.com
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
